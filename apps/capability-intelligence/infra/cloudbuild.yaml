# Cloud Build pipeline. Wired in Batch 9. Placeholder kept here so infra/ has
# a stable entry point.

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "us-central1-docker.pkg.dev/$PROJECT_ID/capability-intelligence/api:$SHORT_SHA", "."]
images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/capability-intelligence/api:$SHORT_SHA"
options:
  logging: CLOUD_LOGGING_ONLY
