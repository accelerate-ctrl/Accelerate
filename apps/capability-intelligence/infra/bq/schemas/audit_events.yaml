# BigQuery schema (Batch 9): audit_events sink (7-year retention).
#
# Mirrors the in-Firestore audit_reports collection, denormalised one
# row per finding for easier SQL drill-down.

dataset: continuous_validation
table: audit_events
description: "Per-finding audit events with severity + back-ref."
clustering: [severity, kind]
partitioning:
  type: DAY
  field: started_at

schema:
  - { name: report_id,       type: STRING,    mode: REQUIRED }
  - { name: started_at,      type: TIMESTAMP, mode: REQUIRED }
  - { name: kind,            type: STRING,    mode: REQUIRED }
  - { name: severity,        type: STRING,    mode: REQUIRED }
  - { name: title,           type: STRING,    mode: NULLABLE }
  - { name: detail,          type: STRING,    mode: NULLABLE }
  - { name: ref_collection,  type: STRING,    mode: NULLABLE }
  - { name: ref_id,          type: STRING,    mode: NULLABLE }
  - { name: metadata,        type: JSON,      mode: NULLABLE }
