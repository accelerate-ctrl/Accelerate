# Cloud Run Job manifests (Batch 9).
#
# All 14 jobs share the same container image — the runner CLI dispatches
# on the JOB_NAME env var. Per-job CPU + memory + timeout follow spec §20.
# Failed executions retry once via Cloud Tasks DLQ (configured in
# infra/terraform/pubsub.tf).

apiVersion: run.googleapis.com/v1
kind: JobList
items:
  # ─── Hourly / sub-hourly ──────────────────────────────────────────────────
  - apiVersion: run.googleapis.com/v1
    kind: Job
    metadata:
      name: news-poll
      labels: { batch: "9" }
    spec:
      template:
        spec:
          template:
            spec:
              timeoutSeconds: 600
              maxRetries: 1
              containers:
                - image: PLACEHOLDER
                  args: ["python", "-m", "app.jobs.runner", "news_poll"]
                  resources: { limits: { cpu: "1", memory: "2Gi" } }

  - apiVersion: run.googleapis.com/v1
