# Cloud Build pipeline.
#
# Works in three independent dimensions:
#   * triggered builds (Cloud Build trigger from GitHub) — uses SHORT_SHA
#   * manual builds (`gcloud builds submit . --config=...`) — SHORT_SHA is
#     empty so we fall back to BUILD_ID (always populated)
#   * any submit cwd — every step starts by sourcing `_LOCATE.sh`, which
#     detects whether the upload tarball is the repo root or the
#     `apps/capability-intelligence/` subdir and `cd`s accordingly. So
#     both `gcloud builds submit . --config=...` from
#     apps/capability-intelligence/ AND from the repo root work.
#
# Order:
#   0. resolve image tag → /workspace/.tag (always non-empty)
#   1. backend pytest
#   2. frontend npm test + build
#   3. docker image build (multi-stage Dockerfile bundles SPA into /app/static)
#   4. push to Artifact Registry
#   5. render service.yaml + deploy to Cloud Run (api service)
#   6. deploy each Cloud Run Job (image-only update)
#   7. smoke test the deployed /api/health endpoint

substitutions:
  _REGION: us-central1
  _REPO: capability-intelligence
  _SERVICE_NAME: capability-intelligence-api

steps:
  # 0) Resolve image tag + locate the app dir. Writes:
  #    /workspace/.tag      — the image tag
  #    /workspace/.appdir   — absolute path to apps/capability-intelligence
  #
  # SHORT_SHA is only populated for triggered builds. For manual
  # `gcloud builds submit` Cloud Build substitutes it to an empty string;
  # BUILD_ID is always present so it's the universal fallback.
  #
  # App-dir auto-detection: when the user submits from inside
  # apps/capability-intelligence/, /workspace IS that dir. When they
  # submit from the repo root, /workspace/apps/capability-intelligence
  # exists. Either way, every later step reads /workspace/.appdir.
  - id: bootstrap
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - "-c"
      - |
        set -euo pipefail
        # tag
        TAG="${SHORT_SHA}"
        if [ -z "$$TAG" ]; then TAG="${BUILD_ID}"; fi
        printf '%s' "$$TAG" > /workspace/.tag
        echo "image tag    = $$TAG"
        # app dir
        if [ -d /workspace/apps/capability-intelligence ]; then
          APP=/workspace/apps/capability-intelligence
        elif [ -d /workspace/backend ] && [ -d /workspace/frontend ]; then
          APP=/workspace
        else
          echo "FATAL: cannot find apps/capability-intelligence in /workspace"
          ls -la /workspace
          exit 2
        fi
        printf '%s' "$$APP" > /workspace/.appdir
        echo "app dir      = $$APP"
        ls "$$APP"

  # 1) Backend tests
  - id: backend-tests
    name: python:3.12
    entrypoint: bash
    args:
      - "-c"
      - |
        set -euo pipefail
        APP=$$(cat /workspace/.appdir)
        cd "$$APP/backend"
        pip install -q -r requirements.txt
        ruff check .
        pytest -q

  # 2) Frontend tests + build
  - id: frontend-tests
    name: node:20
    entrypoint: bash
    args:
      - "-c"
      - |
        set -euo pipefail
        APP=$$(cat /workspace/.appdir)
        cd "$$APP/frontend"
        npm ci --no-audit --no-fund
        npm test -- --run
        npm run build

  # 3) Build image — Dockerfile lives at $APP/Dockerfile.
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - "-c"
      - |
        set -euo pipefail
        TAG=$$(cat /workspace/.tag)
        APP=$$(cat /workspace/.appdir)
        docker build \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:$$TAG" \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:latest" \
          "$$APP"

  # 4) Push both tags.
  - id: docker-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api"

  # 5) Render manifest with the freshly-built image tag, then replace.
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - "-c"
      - |
        set -euo pipefail
        TAG=$$(cat /workspace/.tag)
        APP=$$(cat /workspace/.appdir)
        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:$$TAG"
        sed -e "s|IMAGE_TAG|$$IMAGE|g" \
            "$$APP/infra/service.yaml" \
            > /workspace/service.rendered.yaml
        gcloud run services replace /workspace/service.rendered.yaml \
          --region=${_REGION} --project=${PROJECT_ID}

  # 6) Deploy Cloud Run Jobs (image refresh only — manifests are managed
  # by Terraform). Tolerates missing jobs so the initial deploy succeeds
  # before Terraform has run. Every $VAR that should reach bash is
  # escaped $$VAR so Cloud Build doesn't try to resolve it as a build
  # substitution.
  - id: deploy-jobs
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - "-c"
      - |
        TAG=$$(cat /workspace/.tag)
        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:$$TAG"
        for JOB in news-poll public-filings-poll jira-incremental sow-incremental \
                  sow-full-reindex lifecycle-scoring-daily benchmark-extrapolation-run \
                  benchmark-recompute-quarterly digest-quarterly deep-audit-weekly \
                  eval-run-weekly citation-verify-daily drift-check-daily \
                  evidence-promotion-nightly; do
          gcloud run jobs update $$JOB \
            --image=$$IMAGE \
            --region=${_REGION} || echo "skip: job $$JOB not provisioned yet"
        done

  # 7) Smoke test
  - id: smoke
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - "-c"
      - |
        URL=$$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
        for i in 1 2 3 4 5; do
          if curl -sf "$$URL/api/health"; then exit 0; fi
          sleep 5
        done
        exit 1

# `images:` is the list Cloud Build itself pushes at the end of a successful
# build (it dedupes against what step 4 already pushed). We only list the
# moving "latest" tag here because the SHA/BUILD_ID tag is already pushed
# in step 4 with the correctly-resolved name.
images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 2400s
