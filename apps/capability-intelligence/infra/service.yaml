# Cloud Run service manifest — production deploy.
#
# Apply with (sets the image at deploy time):
#   gcloud run services replace infra/service.yaml \
#     --region=us-central1 --project=digital-maturity-assessor \
#     --image=us-central1-docker.pkg.dev/.../api:<sha>
#
# Secrets referenced here MUST exist in Secret Manager first; provision them
# via infra/setup.sh (idempotent).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: capability-intelligence-api
  labels:
    app: capability-intelligence
    component: api
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      labels:
        app: capability-intelligence
        component: api
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/sessionAffinity: "true"
    spec:
      # Dedicated runtime SA — created by infra/setup.sh.
      serviceAccountName: capability-intelligence@digital-maturity-assessor.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 600
      containers:
        - name: api
          image: IMAGE_TAG
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
          env:
            - name: ENV
              value: prod
            - name: LOG_LEVEL
              value: INFO
            - name: USE_GCP
              value: "true"
            - name: GCP_PROJECT_ID
              value: digital-maturity-assessor
            - name: GCP_PROJECT_NUMBER
              value: "306195530103"
            - name: GCP_REGION
              value: us-central1
            - name: FIRESTORE_DATABASE_ID
              value: dma-assessor
            - name: AUTH_MODE
              # NOTE: 'dev' for the test phase. The SPA currently sends a
              # dev-mode bearer (`dev-mishley.otiende@zennify.com`) which is
              # accepted only when AUTH_MODE=dev + AUTH_ALLOWED_DOMAIN
              # matches. Switch to 'google_oauth' once Google Identity
              # Services is wired into the SPA login flow.
              value: dev
            - name: AUTH_ALLOWED_DOMAIN
              value: zennify.com
            - name: FIREBASE_PROJECT_ID
              value: digital-maturity-assessor
            - name: GOOGLE_OAUTH_CLIENT_ID
              value: 306195530103-ub6t46i8sd9q1eatpt6dgo0i9811mnrp.apps.googleusercontent.com
            - name: GOOGLE_OAUTH_REDIRECT_URIS
              value: '["https://oauth.n8n.cloud/oauth2/callback"]'
            - name: CORS_ORIGINS
              value: '["https://capability.zennify.com","https://oauth.n8n.cloud"]'
            - name: BUCKET_SOWS_RAW
              value: digital-maturity-assessor-sows-raw
            - name: BUCKET_SOWS_REDACTED
              value: digital-maturity-assessor-sows-redacted
            - name: BUCKET_SNAPSHOTS
              value: digital-maturity-assessor-snapshots
            - name: BUCKET_REPORTS
              value: digital-maturity-assessor-reports
            - name: BUCKET_JIRA_RAW
              value: digital-maturity-assessor-jira-raw
            - name: BUCKET_NEWS_RAW
              value: digital-maturity-assessor-news-raw
            - name: LLM_LIVE_MODE
              value: "true"
            - name: ANTHROPIC_MODEL_SONNET
              value: claude-sonnet-4-6
            - name: ANTHROPIC_MODEL_OPUS
              value: claude-opus-4-7
            - name: VERTEX_REGION
              value: us-central1
            - name: VERTEX_EMBEDDING_MODEL
              value: text-embedding-005
            - name: GEMINI_MODEL_FLASH
              value: gemini-2.5-flash
            - name: GEMINI_MODEL_PRO
              value: gemini-2.5-pro
            - name: DAILY_SPEND_CEILING_USD
              value: "50"
            - name: ANTHROPIC_WEEKLY_BUDGET_USD
              value: "200"
            - name: COST_THROTTLE_PCT
              value: "0.9"
            - name: SEC_EDGAR_EMAIL
              value: mishley.otiende@zennify.com
            # ── Drive ingest sources ─────────────────────────────────────
            # Pillar catalogue folder — auto-discovers the highest-version
            # Pillar 1..4 .xlsx inside this folder (or its Pillar-* subfolders).
            - name: DRIVE_PILLARS_FOLDER_ID
              value: 1rF9zdx1qF7BJ9t21eFdvZQW11Y5dUjy3
            # SOW shared drive — deep-recursive walk through every
            # client/project/phase subfolder. Shared drive ID format (starts 0A).
            - name: DRIVE_SOWS_FOLDER_ID
              value: 0AFm0q8PCUPy-Uk9PVA
            # ── Jira (story library) ─────────────────────────────────────
            # JIRA_BASE_URL + JIRA_EMAIL + JIRA_PROJECT_KEYS must all be set
            # for stories ingest to run. Token comes from Secret Manager.
            - name: JIRA_BASE_URL
              value: https://zennify.atlassian.net
            - name: JIRA_EMAIL
              value: mishley.otiende@zennify.com
            - name: JIRA_PROJECT_KEYS
              value: "[]"
            # ── News feeds — FS industry RSS pulled by news_service ──────
            - name: NEWS_FEEDS
              value: '["https://www.americanbanker.com/feed","https://www.federalreserve.gov/feeds/press_all.xml","https://www.fdic.gov/news/news/press/rss.xml","https://www.occ.treas.gov/rss/news-releases.xml","https://www.sec.gov/news/pressreleases.rss","https://www.federalregister.gov/api/v1/documents.rss?conditions[agencies][]=consumer-financial-protection-bureau"]'
            # ── Secrets — mounted from Secret Manager ────────────────────
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api-key
                  key: latest
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-oauth-client-secret
                  key: latest
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jira-api-token
                  key: latest
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 0
            timeoutSeconds: 4
            periodSeconds: 4
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            timeoutSeconds: 4
            periodSeconds: 30
            failureThreshold: 3
  traffic:
    - percent: 100
      latestRevision: true
