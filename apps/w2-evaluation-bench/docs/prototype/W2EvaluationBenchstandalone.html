document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"bf8a5ab2-efe6-493c-a1d3-af98030dad9e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n*{box-sizing:border-box;}\nhtml,body{margin:0;padding:0;}\nbody{font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:#fff;color:#1C4A4D;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}\nbutton{font-family:inherit;cursor:pointer;border:none;background:none;}\ninput,select{font-family:inherit;}\na{color:inherit;}\n:focus-visible{outline:2px solid #139f94;outline-offset:2px;border-radius:3px;}\n@keyframes heroRise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}\n@keyframes drawLine{from{transform:scaleX(0);}to{transform:scaleX(1);}}\n@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}\n.reveal{opacity:0;animation:heroRise .6s cubic-bezier(.2,.8,.2,1) forwards;}\n.pipe-line{transform:scaleX(0);transform-origin:left center;}\n.pipe-line.drawn{animation:drawLine 1.1s cubic-bezier(.2,.8,.2,1) forwards;}\n@media (prefers-reduced-motion: reduce){\n .reveal{animation:none!important;opacity:1!important;transform:none!important;}\n .pipe-line,.pipe-line.drawn{animation:none!important;transform:none!important;}\n}\n@media (max-width:700px){\n .lp-pipe{flex-direction:column!important;gap:14px!important;}\n .lp-pipe .pipe-step{width:100%!important;}\n .lp-pipe .pipe-line{display:none!important;}\n .lp-guar{grid-template-columns:1fr!important;}\n .lp-judges{grid-template-columns:1fr!important;}\n .lp-hpad{padding:70px 22px 80px!important;}\n .lp-sec{padding:56px 22px!important;}\n .lp-h1{font-size:38px!important;}\n}\n@media (max-width:420px){ .lp-h1{font-size:31px!important;} }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;\">\n  <sc-if value=\"{{ isLanding }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n    <!-- HERO -->\n    <header class=\"lp-hpad\" style=\"background:#1E4A48;color:#fff;padding:104px 40px 118px;position:relative;overflow:hidden;\">\n      <div style=\"max-width:1180px;margin:0 auto;position:relative;z-index:2;\">\n        <div class=\"reveal\" style=\"animation-delay:0ms;display:flex;align-items:center;gap:14px;margin-bottom:64px;\">\n          <img src=\"e111ac3a-acfc-4f36-8da5-e184460bff61\" alt=\"Zennify\" style=\"height:26px;width:auto;opacity:.96;\">\n          <span style=\"width:1px;height:20px;background:rgba(255,255,255,.28);\"><\u002Fspan>\n          <span style=\"font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#79E2BF;font-weight:500;\">Evaluation Bench<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"reveal\" style=\"animation-delay:110ms;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#79E2BF;font-weight:500;margin-bottom:22px;\">The W2 Evaluation Bench · v4.7<\u002Fdiv>\n        <h1 class=\"reveal lp-h1\" style=\"animation-delay:200ms;font-size:62px;line-height:1.04;font-weight:600;letter-spacing:-.02em;margin:0 0 26px;max-width:16ch;\">Two models.<br>One blinded verdict.<\u002Fh1>\n        <p class=\"reveal\" style=\"animation-delay:300ms;font-size:19px;line-height:1.6;color:#B0EDD3;max-width:60ch;margin:0 0 40px;font-weight:400;\">The W2 Evaluation Bench scores solution designs against Zennify's frozen senior-SA calibration — judged independently by Claude and Gemini, reconciled on evidence, and delivered as an audit-ready report.<\u002Fp>\n        <div class=\"reveal\" style=\"animation-delay:400ms;display:flex;align-items:center;gap:22px;flex-wrap:wrap;\">\n          <button onclick=\"{{ openBench }}\" style=\"background:#27BBAF;color:#0E2B2A;font-size:16px;font-weight:600;padding:16px 30px;border-radius:12px;transition:filter .12s ease,transform .12s ease;\" style-hover=\"filter:brightness(1.06)\" style-active=\"transform:translateY(1px)\">Open the bench<\u002Fbutton>\n          <span style=\"font-size:14.5px;color:#6B8A8D;color:rgba(176,237,211,.72);\">Runs on your subscription. Zero API billing.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <!-- BEHIND THE SCENES -->\n    <section class=\"lp-sec\" id=\"pipeBand\" style=\"background:#E8F7F6;padding:88px 40px;\">\n      <div style=\"max-width:1180px;margin:0 auto;\">\n        <div style=\"font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#139F94;font-weight:600;margin-bottom:16px;\">Behind the scenes<\u002Fdiv>\n        <h2 style=\"font-size:34px;font-weight:600;letter-spacing:-.015em;margin:0 0 8px;color:#1C4A4D;\">From two documents to one audit-ready report<\u002Fh2>\n        <p style=\"font-size:16.5px;line-height:1.6;color:#3E6062;max-width:64ch;margin:0 0 52px;\">Seven deterministic stages sit between the upload and the report. Only the first one needs a person.<\u002Fp>\n        <div class=\"lp-pipe\" style=\"display:flex;align-items:stretch;gap:0;position:relative;\">\n          <div class=\"pipe-line\" id=\"pipeLine\" style=\"position:absolute;top:34px;left:7%;right:7%;height:2px;background:linear-gradient(90deg,#139F94,#A5C6FF,#B19CD8,#FFCB99,#27BBAF);z-index:0;\"><\u002Fdiv>\n          <div class=\"pipe-step\" style=\"width:14.28%;padding:0 9px;position:relative;z-index:1;\">\n            <div style=\"width:58px;height:58px;border-radius:16px;background:#fff;border:1px solid rgba(19,159,148,.28);display:flex;align-items:center;justify-content:center;color:#139F94;margin-bottom:16px;\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 16V4\"><\u002Fpath><path d=\"M8 8l4-4 4 4\"><\u002Fpath><path d=\"M4 20h16\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#139F94;margin-bottom:4px;\">01<\u002Fdiv>\n            <div style=\"font-size:15.5px;font-weight:600;margin-bottom:8px;color:#1C4A4D;\">Upload<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.5;color:#4E7072;\">A BRD and one or two SDDs; the only human step.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pipe-step\" style=\"width:14.28%;padding:0 9px;position:relative;z-index:1;\">\n            <div style=\"width:58px;height:58px;border-radius:16px;background:#fff;border:1px solid rgba(128,148,192,.34);display:flex;align-items:center;justify-content:center;color:#7086C0;margin-bottom:16px;\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\"><\u002Frect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#7086C0;margin-bottom:4px;\">02<\u002Fdiv>\n            <div style=\"font-size:15.5px;font-weight:600;margin-bottom:8px;color:#1C4A4D;\">Sealed blinding<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.5;color:#4E7072;\">Lane identities locked in an escrow no one and nothing reads until the final step; judges see only “Output A/B”.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pipe-step\" style=\"width:14.28%;padding:0 9px;position:relative;z-index:1;\">\n            <div style=\"width:58px;height:58px;border-radius:16px;background:#fff;border:1px solid rgba(177,156,216,.34);display:flex;align-items:center;justify-content:center;color:#9A82C4;margin-bottom:16px;\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"4\" width=\"7\" height=\"7\" rx=\"1.4\"><\u002Frect><rect x=\"13\" y=\"4\" width=\"7\" height=\"7\" rx=\"1.4\"><\u002Frect><rect x=\"4\" y=\"13\" width=\"7\" height=\"7\" rx=\"1.4\"><\u002Frect><rect x=\"13\" y=\"13\" width=\"7\" height=\"7\" rx=\"1.4\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#9A82C4;margin-bottom:4px;\">03<\u002Fdiv>\n            <div style=\"font-size:15.5px;font-weight:600;margin-bottom:8px;color:#1C4A4D;\">Frozen calibration<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.5;color:#4E7072;\">99 criteria from Zennify's SDD standard and the Salesforce Well-Architected framework, filtered to the engagement.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pipe-step\" style=\"width:14.28%;padding:0 9px;position:relative;z-index:1;\">\n            <div style=\"width:58px;height:58px;border-radius:16px;background:#fff;border:1px solid rgba(19,159,148,.28);display:flex;align-items:center;justify-content:center;color:#139F94;margin-bottom:16px;\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"4\" width=\"7\" height=\"16\" rx=\"1.4\"><\u002Frect><rect x=\"13\" y=\"4\" width=\"7\" height=\"16\" rx=\"1.4\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#139F94;margin-bottom:4px;\">04<\u002Fdiv>\n            <div style=\"font-size:15.5px;font-weight:600;margin-bottom:8px;color:#1C4A4D;\">Dual-judge scoring<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.5;color:#4E7072;\">Claude and Gemini each score every criterion independently from byte-identical packets, quoting the document verbatim for every verdict.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pipe-step\" style=\"width:14.28%;padding:0 9px;position:relative;z-index:1;\">\n            <div style=\"width:58px;height:58px;border-radius:16px;background:#fff;border:1px solid rgba(255,203,153,.5);display:flex;align-items:center;justify-content:center;color:#D98A3D;margin-bottom:16px;\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"7\" cy=\"6\" r=\"2.2\"><\u002Fcircle><circle cx=\"7\" cy=\"18\" r=\"2.2\"><\u002Fcircle><circle cx=\"17\" cy=\"12\" r=\"2.2\"><\u002Fcircle><path d=\"M7 8.2v7.6\"><\u002Fpath><path d=\"M9.1 6.3h2.9a3 3 0 0 1 3 3v.5\"><\u002Fpath><path d=\"M9.1 17.7h2.9a3 3 0 0 0 3-3v-.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#D98A3D;margin-bottom:4px;\">05<\u002Fdiv>\n            <div style=\"font-size:15.5px;font-weight:600;margin-bottom:8px;color:#1C4A4D;\">Evidence-ruled consensus<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.5;color:#4E7072;\">Divergences are reconciled only by pointing at what the SDD actually says; genuine disagreements are preserved as dissents and resolved conservatively, never averaged away.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pipe-step\" style=\"width:14.28%;padding:0 9px;position:relative;z-index:1;\">\n            <div style=\"width:58px;height:58px;border-radius:16px;background:#fff;border:1px solid rgba(128,148,192,.34);display:flex;align-items:center;justify-content:center;color:#7086C0;margin-bottom:16px;\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l7 3v5c0 4.6-3.1 7.7-7 9-3.9-1.3-7-4.4-7-9V6z\"><\u002Fpath><path d=\"M9 12l2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#7086C0;margin-bottom:4px;\">06<\u002Fdiv>\n            <div style=\"font-size:15.5px;font-weight:600;margin-bottom:8px;color:#1C4A4D;\">28-rule validation<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.5;color:#4E7072;\">Every anchor, citation, attestation, and deduction must pass the framework's validation gate before a report can exist.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pipe-step\" style=\"width:14.28%;padding:0 9px;position:relative;z-index:1;\">\n            <div style=\"width:58px;height:58px;border-radius:16px;background:#fff;border:1px solid rgba(39,187,175,.34);display:flex;align-items:center;justify-content:center;color:#139F94;margin-bottom:16px;\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\"><\u002Frect><path d=\"M8 11V8a4 4 0 0 1 7.5-2.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#139F94;margin-bottom:4px;\">07<\u002Fdiv>\n            <div style=\"font-size:15.5px;font-weight:600;margin-bottom:8px;color:#1C4A4D;\">Sealed reveal &amp; report<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.5;color:#4E7072;\">The escrow is opened last; the methodology lift is oriented and the branded report is built with a full audit trail.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- GUARANTEES -->\n    <section class=\"lp-sec\" style=\"background:#fff;padding:82px 40px;\">\n      <div style=\"max-width:1180px;margin:0 auto;\">\n        <div class=\"lp-guar\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:20px;\">\n          <div style=\"background:#E8F7F6;border-radius:20px;padding:26px 24px;\">\n            <div style=\"color:#139F94;margin-bottom:16px;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\"><\u002Frect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div style=\"font-size:16px;font-weight:600;margin-bottom:8px;color:#1C4A4D;\">Blinded until the last step<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.55;color:#4E7072;\">The lane-identity escrow is written at intake and first read at reveal — never by a judge, never by a route.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#E8F7F6;border-radius:20px;padding:26px 24px;\">\n            <div style=\"color:#7086C0;margin-bottom:16px;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"4\" width=\"7\" height=\"16\" rx=\"1.4\"><\u002Frect><rect x=\"13\" y=\"4\" width=\"7\" height=\"16\" rx=\"1.4\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n            <div style=\"font-size:16px;font-weight:600;margin-bottom:8px;color:#1C4A4D;\">Two independent model families<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.55;color:#4E7072;\">Claude and Gemini score in isolation; dissents are preserved, not averaged away.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#E8F7F6;border-radius:20px;padding:26px 24px;\">\n            <div style=\"color:#9A82C4;margin-bottom:16px;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h11\"><\u002Fpath><path d=\"M4 12h16\"><\u002Fpath><path d=\"M4 19h9\"><\u002Fpath><path d=\"M18 4l2 2-2 2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div style=\"font-size:16px;font-weight:600;margin-bottom:8px;color:#1C4A4D;\">Every claim anchored verbatim<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.55;color:#4E7072;\">Each verdict quotes the exact SDD text it rests on — no claim without an anchor.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#E8F7F6;border-radius:20px;padding:26px 24px;\">\n            <div style=\"color:#D98A3D;margin-bottom:16px;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l7 3v5c0 4.6-3.1 7.7-7 9-3.9-1.3-7-4.4-7-9V6z\"><\u002Fpath><path d=\"M9 12l2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div style=\"font-size:16px;font-weight:600;margin-bottom:8px;color:#1C4A4D;\">Zero API billing<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.55;color:#4E7072;\">Subscription tokens only, with billing guards and a server tripwire. Reported API cost stays $0.00.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- THE JUDGES -->\n    <section class=\"lp-sec\" style=\"background:#1E3A3A;color:#fff;padding:84px 40px;\">\n      <div style=\"max-width:1180px;margin:0 auto;\">\n        <div style=\"font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#79E2BF;font-weight:600;margin-bottom:16px;\">The judges<\u002Fdiv>\n        <h2 style=\"font-size:32px;font-weight:600;letter-spacing:-.015em;margin:0 0 44px;max-width:24ch;\">Two unrelated model families, scoring in the dark<\u002Fh2>\n        <div class=\"lp-judges\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px;\">\n          <div style=\"border:1px solid rgba(121,226,191,.24);border-radius:22px;padding:32px 30px;background:rgba(255,255,255,.02);\">\n            <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:18px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#27BBAF;\"><\u002Fspan><span style=\"font-size:20px;font-weight:600;\">Claude<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#79E2BF;\">via Claude Code<\u002Fspan><\u002Fdiv>\n            <p style=\"font-size:15px;line-height:1.6;color:#B0EDD3;margin:0;\">Runs under Zennify's own Claude subscription on operator-controlled compute. Never sees Gemini's scores before reconciliation.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid rgba(165,198,255,.24);border-radius:22px;padding:32px 30px;background:rgba(255,255,255,.02);\">\n            <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:18px;\"><span style=\"width:11px;height:11px;border-radius:50%;background:#A5C6FF;\"><\u002Fspan><span style=\"font-size:20px;font-weight:600;\">Gemini<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#A5C6FF;\">via Google API<\u002Fspan><\u002Fdiv>\n            <p style=\"font-size:15px;line-height:1.6;color:#B0EDD3;margin:0;\">Runs on Google's paid API from the same box. Never sees Claude's scores before reconciliation.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- FOOTER -->\n    <footer style=\"background:#1E4A48;color:#fff;padding:52px 40px;\">\n      <div style=\"max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap;\">\n        <div>\n          <img src=\"e111ac3a-acfc-4f36-8da5-e184460bff61\" alt=\"Zennify\" style=\"height:22px;margin-bottom:16px;opacity:.9;\">\n          <div style=\"font-size:13.5px;line-height:1.6;color:rgba(176,237,211,.72);max-width:52ch;\">Internal Zennify tool — the W2 Evaluation Bench, Solutioning Evaluation Framework <span style=\"font-family:'IBM Plex Mono',monospace;\">v4.7<\u002Fspan>. Reports are the artifact of record; the six-document build set governs behavior.<\u002Fdiv>\n        <\u002Fdiv>\n        <button onclick=\"{{ openBench }}\" style=\"background:#27BBAF;color:#0E2B2A;font-size:14.5px;font-weight:600;padding:13px 24px;border-radius:11px;\">Open the bench<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Ffooter>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isBench }}\" hint-placeholder-val=\"{{ false }}\">{{ benchNode }}<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;}}\">\nconst h = React.createElement;\n\n// ---------- palette ----------\nconst C = { deep:'#1c4a4d', teal:'#139f94', sub:'#22bcad', blue:'#8094c0', pos:'#059669', neg:'#c25008', paper:'#f2f5f4', card:'#ffffff', ink2:'#5c7a7c', line:'rgba(28,74,77,0.14)', line2:'rgba(28,74,77,0.08)', mono:\"'IBM Plex Mono',ui-monospace,Menlo,monospace\" };\n\nconst DIM_META = [\n  {n:1,name:'Requirements parsing',crit:['Requirement parsing depth','Stakeholder & persona recognition','Constraint & assumption extraction']},\n  {n:2,name:'Traceability & NFR coverage',crit:['Functional requirement traceability','NFR coverage','Gap & risk identification']},\n  {n:3,name:'Architecture & design quality',crit:['Cloud module selection','Trusted design','Easy design','Adaptable design']},\n  {n:4,name:'Component completeness',crit:['Component presence','Architectural decision quality']},\n  {n:5,name:'Security & trust',crit:['Data protection','Access control','Compliance posture']},\n  {n:6,name:'Operations & reliability',crit:['Observability','Resilience','Runbook & recovery']},\n  {n:7,name:'Integration & data',crit:['Integration pattern fit','Data model quality','Event & error handling']},\n];\nconst DIM_MAX_NORMAL = [15,15,20,15,10,10,15];\n\nconst STAGES_A = ['intake','setup','mapping','dual scoring','consensus','checkpoint','sheets+lift','reveal+report'];\nconst STAGES_B = ['intake','setup','mapping','dual scoring','consensus','review+report'];\n\nfunction pad(n){return String(n).padStart(2,'0');}\nfunction fmtRunId(mode,d){\n  d=d| s._onResize=()=>this.setState({width:window.innerWidth});\n    window.addEventListener('resize',this._onResize);\n    // capture real post-layout width (mount may precede final iframe size)\n    requestAnimationFrame(()=>this.setState({width:window.innerWidth}));\n    setTimeout(()=>this.setState({width:window.innerWidth}),150);\n    try{ if(window.ResizeObserver){ this._ro=new ResizeObserver(()=>this.setState({width:window.innerWidth})); this._ro.observe(document.documentElement); } }catch(e){}\n    // ticker (guard against duplicate intervals on any remount)\n    if(this._tick) clearInterval(this._tick);\n    this._tick=setInterval(()=>{ this.advanceLiveRuns(); this.setState({now:Date.now()}); },1000);\n    // pipeline draw\n    try{\n      const io=new IntersectionObserver((es)=>{es.forEach(e=>{ if(e.isIntersecting){ const l=document.getElementById('pipeLine'); if(l) l.classList.add('drawn'); io.disconnect(); } });},{threshold:.25});\n      const band=document.getElementById('pipeBand'); if(band) io.observe(band);\n    }catch(e){}\n  }\n  componentWillUnmount(){ clearInterval(this._tick); window.removeEventListener('resize',this._onResize); try{ if(this._ro) this._ro.disconnect(); }catch(e){} }\n\n  seedRuns(){\n    const now=new Date();\n    // Run 1 — done Mode A\n    const r1LaneA=genLane([[13.5,13,13.2],[12,12.5,12.2],[17.5,15,16],[11,11.5,11],[8,8,8],[7.5,6.5,6.8],[12,10.5,10.8]],[3,7]);\n    const r1LaneB=genLane([[12.6,11.5,11.8],[11,11,11],[15,14,14.2],[10,10,10],[7,7,7],[6,6,6],[9.5,9,9]],[]);\n    const run1={\n      run_id:'W2-20260702-154210-A-a7f3c9', mode:'A', status:'done', stageIdx:7, live:false, pause:false,\n      created_at:'2026-07-02 15:42', updated_at:'2026-07-02 16:11',\n      files:{brd:'acme-brd.md',sdd_1:'sdd-vendor-x.md',sdd_2:'sdd-zenagent.md'},\n      lanes:{'Output A':r1LaneA,'Output B':r1LaneB},\n      stats:{verdict:0.91,concord:0.88,dissents:2,overall:0.895},\n      usage:{packets:17,ccIn:428000,ccOut:38200,gmIn:212000,gmOut:9100}
