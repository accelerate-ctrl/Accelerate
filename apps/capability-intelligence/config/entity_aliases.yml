# Canonical-name resolution. Activated in Batch 3.
# Manual aliases override fuzzy matching. Keys are the canonical names; values
# are alternate spellings. Add new entries as we ingest more SOWs and stories.

aliases:
  client:
    "Wells Fargo":            ["WFC", "Wells Fargo Bank, N.A.", "Wells Fargo & Co"]
    "JPMorgan Chase":         ["JPM", "Chase Bank", "J.P. Morgan", "JP Morgan"]
    "Bank of America":        ["BofA", "BAC", "B of A"]
    "Citigroup":              ["Citi", "Citibank"]
    "U.S. Bank":              ["USB", "US Bank", "US Bancorp", "U.S. Bancorp"]
    "Truist":                 ["TFC", "Truist Financial"]
    "PNC Bank":               ["PNC", "PNC Financial Services"]
    "Capital One":            ["COF"]
    "Charles Schwab":         ["SCHW", "Schwab", "Charles Schwab Corp"]
    "Goldman Sachs":          ["GS", "Goldman", "GS Group"]
    "Morgan Stanley":         ["MS"]
    "BlackRock":              ["BLK"]
    "State Street":           ["STT"]
    "Northern Trust":         ["NTRS"]
    "Northwestern Mutual":    ["NM", "NWM"]
    "MassMutual":             ["Massachusetts Mutual Life Insurance"]
    "Prudential":             ["PRU", "Prudential Financial"]
    "Lincoln Financial":      ["LNC"]
    "Marsh McLennan":         ["MMC", "Marsh & McLennan"]
